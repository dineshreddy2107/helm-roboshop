apiVersion: v1 
kind: Service 
metadata:
  name: mongodb-headless
  namespace: roboshop 
  labels:
    component: mongodb
    project: roboshop
    tier: database
spec:
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
  clusterIP: None
  selector:
     component: mongodb
     project: roboshop
     tier: database